<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="app-repo" content="neon-wizard">
<meta name="app-version" content="0.0.3">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NEON WIZARD</title>
<style>
:root{--c:#2ef3ff;--m:#ff2bd6;--y:#ffe14a;--v:#b35cff;--ink:#eaf6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#gl,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
.hide{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;touch-action:manipulation;cursor:pointer}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.chip{display:inline-block;width:1.1em;height:1.1em;border-radius:50%;vertical-align:-.18em;flex:none;background:radial-gradient(circle,#1a0626 0 33%,#c77dff 34% 40%,#1a0626 41% 56%,transparent 57%),repeating-conic-gradient(#b35cff 0 15deg,#0d0014 15deg 30deg);box-shadow:0 0 7px rgba(179,92,255,.85),inset 0 0 0 1.5px #0d0014}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
#sheet{display:grid;grid-template-columns:repeat(9,1fr) 1.4fr;gap:3px}
.fr{position:relative;height:42px;border:1px solid rgba(46,243,255,.3);background:rgba(3,6,18,.62);border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
.fr.cur{border-color:var(--m);box-shadow:0 0 10px rgba(255,43,214,.55),inset 0 0 8px rgba(255,43,214,.25)}
.fr .r{display:flex;justify-content:flex-end;height:18px}
.fr .r b{width:min(14px,33%);font-size:11px;line-height:17px;text-align:center;border-left:1px solid rgba(46,243,255,.2);border-bottom:1px solid rgba(46,243,255,.2);font-weight:800}
.fr .r b.x{color:var(--m);text-shadow:0 0 6px var(--m)}
.fr .r b.s{color:var(--c);text-shadow:0 0 6px var(--c)}
.fr .t{flex:1;text-align:center;font-size:13px;line-height:23px;font-weight:700}
#sheet.mini{display:flex;justify-content:center}
.mb{padding:9px 16px;border:1px solid rgba(46,243,255,.35);background:rgba(3,6,18,.62);border-radius:12px;font-size:12px;letter-spacing:.2em;display:flex;gap:16px;font-weight:800}
.mb em{font-style:normal;color:var(--c);text-shadow:0 0 8px var(--c)}
#row2{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
#pauseBtn{pointer-events:auto;width:38px;height:38px;flex:none;border-radius:50%;border:1px solid rgba(46,243,255,.4);background:rgba(3,6,18,.55);font-weight:900;font-size:12px;letter-spacing:1px;color:var(--c)}
#dimName{flex:1;text-align:center;font-size:10px;letter-spacing:.42em;opacity:.7;text-transform:uppercase;padding-left:.42em;white-space:nowrap;overflow:hidden}
#superBox{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid rgba(255,43,214,.4);background:rgba(3,6,18,.58)}
#multi{font-weight:900;font-style:italic;font-size:15px;color:#fff;background:linear-gradient(90deg,var(--m),var(--v));border-radius:999px;padding:3px 9px;box-shadow:0 0 10px rgba(255,43,214,.7)}
#pot{font-size:15px;font-weight:800;min-width:3ch;text-align:right;text-shadow:0 0 8px rgba(255,43,214,.8)}
.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.22)}}
#power{position:absolute;right:max(16px,env(safe-area-inset-right));top:30%;width:16px;height:38%;border-radius:10px;border:1px solid rgba(46,243,255,.5);background:rgba(3,6,18,.62);overflow:hidden;opacity:0;transition:opacity .2s}
#power.on{opacity:1}
#powSweet{position:absolute;left:0;right:0;top:5%;height:11%;background:rgba(255,225,74,.2);border-top:1px solid rgba(255,225,74,.75);border-bottom:1px solid rgba(255,225,74,.75)}
#powFill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,var(--c),var(--m) 70%,var(--y));box-shadow:0 0 12px var(--m)}
#phase{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:20px;font-size:10px;letter-spacing:.35em;font-weight:800}
#phase span{opacity:.25;transition:opacity .2s,color .2s,text-shadow .2s;padding-left:.35em}
#phase span.on{opacity:1;color:var(--c);text-shadow:0 0 8px var(--c)}
#phase span.done{opacity:.55}

/* ---------- banner / pops / dimension card ---------- */
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;transform:scale(.55);transition:opacity .22s,transform .4s cubic-bezier(.2,1.5,.4,1);--bc:#2ef3ff}
#banner.on{opacity:1;transform:scale(1)}
#bTitle{font-size:clamp(46px,15vw,124px);font-weight:900;font-style:italic;letter-spacing:.03em;line-height:1;color:#fff;text-shadow:0 0 6px var(--bc),0 0 22px var(--bc),0 0 60px var(--bc)}
#bSub{margin-top:10px;font-size:12px;letter-spacing:.5em;padding-left:.5em;text-transform:uppercase;opacity:.92;text-shadow:0 0 8px var(--bc)}
#pops{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pp{position:absolute;font-weight:900;font-style:italic;font-size:22px;color:#fff;text-shadow:0 0 10px var(--m),0 0 20px var(--m);animation:rise 1.1s ease-out forwards;white-space:nowrap}
@keyframes rise{from{opacity:1;transform:translate(-50%,0) scale(1.25)}to{opacity:0;transform:translate(-50%,-80px) scale(.9)}}
#dimCard{position:fixed;left:0;right:0;top:22%;text-align:center;pointer-events:none;opacity:0;transition:opacity .8s,letter-spacing 1.6s cubic-bezier(.15,.85,.2,1),filter 1s;letter-spacing:1.2em;filter:blur(12px)}
#dimCard.on{opacity:1;letter-spacing:.38em;filter:blur(0)}
#dimCard h2{margin:0;font-weight:200;font-size:clamp(30px,9vw,70px);padding-left:.38em;text-shadow:0 0 18px var(--dc,#2ef3ff),0 0 50px var(--dc,#2ef3ff)}
#dimCard p{margin:.8em 0 0;font-size:11px;letter-spacing:.4em;opacity:.8;text-transform:uppercase}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 35%,rgba(10,0,30,.1),rgba(0,0,0,.72))}
.btn{min-width:220px;padding:15px 30px 15px calc(30px + .32em);border-radius:999px;border:1.5px solid var(--c);color:#fff;font-weight:800;letter-spacing:.32em;font-size:15px;background:rgba(46,243,255,.08);box-shadow:0 0 18px rgba(46,243,255,.42),inset 0 0 14px rgba(46,243,255,.16);text-shadow:0 0 8px var(--c)}
.btn.m{border-color:var(--m);background:rgba(255,43,214,.08);box-shadow:0 0 18px rgba(255,43,214,.42),inset 0 0 14px rgba(255,43,214,.16);text-shadow:0 0 8px var(--m)}
.btn.sm{min-width:0;padding:10px 16px 10px calc(16px + .25em);font-size:11px;letter-spacing:.25em}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.35}
#menu{justify-content:space-between}
.logo{margin-top:8vh;text-align:center;line-height:.92}
.logo .a,.logo .b{display:block;font-weight:900;font-style:italic;font-size:clamp(54px,19vw,150px);letter-spacing:.02em;color:transparent;-webkit-text-stroke:2px #fff}
.logo .a{-webkit-text-stroke-color:#d8fdff;text-shadow:0 0 10px var(--c),0 0 30px var(--c),0 0 70px var(--c)}
.logo .b{-webkit-text-stroke-color:#ffe0f7;text-shadow:0 0 10px var(--m),0 0 30px var(--m),0 0 70px var(--m);animation:flick 7s infinite}
@keyframes flick{0%,91%,95%,100%{opacity:1}92%,94%{opacity:.3}}
.logo .tag{display:block;margin-top:20px;font-size:11px;letter-spacing:.55em;opacity:.75;padding-left:.55em;text-transform:uppercase}
.mbtns{display:flex;flex-direction:column;gap:14px;align-items:center;margin-bottom:5vh}
.bal{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;padding:7px 16px;border-radius:999px;background:rgba(3,6,18,.62);border:1px solid rgba(179,92,255,.5);box-shadow:0 0 12px rgba(179,92,255,.3)}
.bal.sm{font-size:14px;padding:6px 12px}
.sub{font-size:11px;letter-spacing:.3em;opacity:.6;text-transform:uppercase;min-height:1em}
.lhead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ltitle{font-weight:900;font-style:italic;letter-spacing:.2em;font-size:18px;text-shadow:0 0 10px var(--c),0 0 24px var(--c)}

/* locker */
#locker{padding-left:0;padding-right:0;justify-content:flex-start;background:linear-gradient(180deg,rgba(0,0,0,.25) 0,rgba(0,0,0,0) 12%,rgba(0,0,0,0) 38%,rgba(2,2,10,.94) 50%)}
#locker .lhead{padding:0 14px}
#show{height:31vh;width:100%;flex:none}
#eqName{text-align:center;font-size:10px;letter-spacing:.18em;padding:0 12px;opacity:.9;min-height:16px;text-transform:uppercase;text-shadow:0 0 8px var(--c)}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 8px;width:100%;flex:none;touch-action:pan-x;scrollbar-width:none}
.tab{flex:none;padding:8px 12px;border-radius:999px;border:1px solid rgba(46,243,255,.35);font-size:10px;letter-spacing:.2em;font-weight:800;opacity:.75;display:flex;gap:5px;align-items:center}
.tab.on{opacity:1;border-color:var(--c);box-shadow:0 0 10px rgba(46,243,255,.5);color:#fff}
.tab.lk{opacity:.45;border-style:dashed}
#grid{flex:1;width:100%;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:4px 12px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;align-content:start}
.it{position:relative;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(10,12,30,.75);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.it canvas{width:72px;height:72px;display:block}
.it .nm{font-size:10px;font-weight:800;letter-spacing:.12em;line-height:1.2;min-height:2.4em;display:flex;align-items:center;text-transform:uppercase}
.it .pr{font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px}
.it.own .pr{color:var(--c);font-size:10px;letter-spacing:.2em}
.it.eq{border-color:var(--c);box-shadow:0 0 12px rgba(46,243,255,.45)}
.it.eq .pr{color:var(--y)}
.it.cant .pr{opacity:.45}
.it.arm{border-color:var(--y);box-shadow:0 0 14px rgba(255,225,74,.55)}
.it.arm .pr{color:var(--y)}
.it.lock canvas{filter:grayscale(.55) brightness(.5)}
.it.lock .pr{opacity:.55}
.it.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.gate{grid-column:1/-1;padding:12px;border-radius:12px;border:1px dashed rgba(179,92,255,.6);text-align:center;font-size:11px;letter-spacing:.2em;line-height:1.6;background:rgba(20,6,30,.6)}
.gate b{color:var(--v);text-shadow:0 0 8px var(--v)}
.gate .bar{height:5px;border-radius:5px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}
.gate .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--m))}

/* mini-games list */
#minis{justify-content:flex-start;gap:12px;background:rgba(0,0,0,.8)}
#mlist{width:min(420px,100%);display:flex;flex-direction:column;gap:12px;overflow-y:auto;touch-action:pan-y;padding-bottom:10px}
.mg{border-radius:16px;border:1px solid rgba(46,243,255,.3);background:rgba(10,12,30,.8);padding:14px;display:flex;gap:14px;align-items:center}
.mg canvas{width:84px;height:84px;flex:none;border-radius:12px;display:block}
.mg .tx{flex:1}
.mg h3{margin:0 0 4px;font-size:15px;letter-spacing:.22em;font-style:italic;text-shadow:0 0 8px var(--c)}
.mg p{margin:0 0 8px;font-size:12px;opacity:.75;line-height:1.4}
.mg.lock{opacity:.55;border-style:dashed}
.mg .best{font-size:10px;letter-spacing:.2em;opacity:.6}

/* results / bonus / pause */
#results{justify-content:center;gap:8px;background:rgba(0,0,0,.74)}
.rtitle{font-weight:900;font-style:italic;font-size:30px;letter-spacing:.1em;text-shadow:0 0 14px var(--m),0 0 30px var(--m)}
.rscore{font-size:60px;font-weight:900;text-shadow:0 0 18px var(--c)}
#rlines{width:min(340px,92vw);display:flex;flex-direction:column;gap:6px;margin:6px 0}
.rl{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.1em;padding:7px 12px;border-radius:9px;background:rgba(10,12,30,.78);border:1px solid rgba(255,255,255,.06);opacity:0;transform:translateY(8px);transition:.3s;text-transform:uppercase}
.rl.on{opacity:1;transform:none}
.rl .v{display:flex;align-items:center;gap:6px;font-weight:800}
.rtot{font-size:30px;font-weight:900;display:flex;align-items:center;gap:10px;margin:4px 0 14px;text-shadow:0 0 12px var(--v)}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
#bonus,#pause{justify-content:center;background:rgba(0,0,0,.72)}
.card{width:min(340px,92vw);border-radius:22px;border:1.5px solid var(--m);background:rgba(12,4,24,.88);box-shadow:0 0 30px rgba(255,43,214,.35);padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.card canvas{width:120px;height:120px;border-radius:16px;display:block}
.ctag{font-size:11px;letter-spacing:.5em;color:var(--y);text-shadow:0 0 8px var(--y);padding-left:.5em}
.cname{font-size:28px;font-weight:900;font-style:italic;letter-spacing:.08em;text-shadow:0 0 14px var(--c)}
.cdesc{font-size:13px;opacity:.8;line-height:1.5}
.ptitle{font-size:30px;font-weight:900;font-style:italic;letter-spacing:.3em;margin-bottom:16px;text-shadow:0 0 14px var(--c)}
/* first-throw tutorial */
#tut{position:fixed;inset:0;pointer-events:none}
#tut .cap{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 104px);transform:translateX(-50%);width:min(320px,86vw);padding:12px 16px;border-radius:16px;background:rgba(6,4,20,.84);border:1px solid rgba(46,243,255,.55);box-shadow:0 0 18px rgba(46,243,255,.35);text-align:center}
#tut .cap.in{animation:tin .35s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}
#tutN{font-size:10px;letter-spacing:.35em;padding-left:.35em;color:var(--y);text-shadow:0 0 8px var(--y);margin-bottom:6px;font-weight:800}
#tutT{font-size:14px;line-height:1.45;font-weight:600}
.finger{position:absolute;left:50%;bottom:24%;width:56px;height:56px;margin-left:-28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 14px #fff,0 0 30px var(--c),inset 0 0 12px var(--c);background:rgba(46,243,255,.18)}
.finger i{position:absolute;inset:-14px;border-radius:50%;border:2px solid var(--c);opacity:0}
.f-drag{animation:tdrag 1.8s ease-in-out infinite}
@keyframes tdrag{0%,100%{transform:translateX(-70px)}50%{transform:translateX(70px)}}
.f-tap,.f-power{animation:ttap 1.1s ease-in-out infinite}
.f-tap i,.f-power i{animation:tring 1.1s ease-out infinite}
@keyframes ttap{0%,60%,100%{transform:scale(1)}30%{transform:scale(.72)}}
@keyframes tring{0%,25%{opacity:0;transform:scale(.6)}35%{opacity:.9}100%{opacity:0;transform:scale(1.5)}}
.f-power{left:auto;right:calc(max(16px,env(safe-area-inset-right)) + 30px);bottom:auto;top:46%;margin:0}
.f-swipe{animation:tswipe 1.6s cubic-bezier(.3,.1,.3,1) infinite}
@keyframes tswipe{0%{transform:translate(0,0) scale(1);opacity:0}12%{opacity:1}55%{transform:translate(-14px,-120px) scale(.9)}85%{transform:translate(-60px,-230px) scale(.75);opacity:1}100%{transform:translate(-70px,-250px) scale(.7);opacity:0}}
.f-none{display:none}
#ver{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:max(4px,env(safe-area-inset-bottom));font-size:9px;opacity:.35;letter-spacing:.1em;pointer-events:none;z-index:50}
#err{position:fixed;inset:20px;color:#ff9aa8;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow:auto;z-index:99;background:rgba(0,0,0,.85);padding:12px;border:1px solid #f36}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>

<div id="hud" class="hide">
  <div id="sheet"></div>
  <div id="row2">
    <button id="pauseBtn" aria-label="Pause">II</button>
    <div id="dimName"></div>
    <div id="superBox"><span id="multi">x1</span><span id="pot" class="mono">0</span></div>
  </div>
  <div id="power"><div id="powSweet"></div><div id="powFill"></div></div>
  <div id="phase"><span data-p="aim">AIM</span><span data-p="power">POWER</span><span data-p="spin">SPIN</span></div>
</div>
<div id="banner"><div id="bTitle"></div><div id="bSub"></div></div>
<div id="dimCard"><h2 id="dcName"></h2><p id="dcSub"></p></div>
<div id="pops"></div>
<div id="tut" class="hide"><div class="cap" id="tutCap"><div id="tutN"></div><div id="tutT"></div></div><div id="tutF" class="finger f-none"><i></i></div></div>

<div id="menu" class="screen hide">
  <div class="logo"><span class="a">NEON</span><span class="b">WIZARD</span><span class="tag">ten-pin · beyond reality</span></div>
  <div class="mbtns">
    <div class="bal"><i class="chip"></i><span id="mChips" class="mono">0</span></div>
    <button class="btn" id="bPlay">BOWL</button>
    <button class="btn m" id="bMinis">MINI-GAMES</button>
    <button class="btn" id="bLocker">LOCKER</button>
    <div class="sub" id="mBest"></div>
  </div>
</div>

<div id="locker" class="screen hide">
  <div class="lhead"><button class="btn sm" id="lBack">BACK</button><div class="ltitle">LOCKER</div><div class="bal sm"><i class="chip"></i><span id="lChips" class="mono">0</span></div></div>
  <div id="show"></div>
  <div id="eqName"></div>
  <div id="tabs"></div>
  <div id="grid"></div>
</div>

<div id="minis" class="screen hide">
  <div class="lhead"><button class="btn sm" id="mgBack">BACK</button><div class="ltitle">MINI-GAMES</div><div class="bal sm"><i class="chip"></i><span id="mgChips" class="mono">0</span></div></div>
  <div id="mlist"></div>
</div>

<div id="results" class="screen hide">
  <div class="rtitle" id="rTitle">GAME OVER</div>
  <div class="rscore mono" id="rScore">0</div>
  <div id="rlines"></div>
  <div class="rtot"><i class="chip"></i><span id="rTot" class="mono">+0</span></div>
  <div class="col"><button class="btn" id="rAgain">BOWL AGAIN</button><button class="btn sm m" id="rMenu">MENU</button></div>
</div>

<div id="bonus" class="screen hide">
  <div class="card">
    <div class="ctag" id="bnTag">BONUS ROUND</div>
    <canvas id="bnArt" width="240" height="240"></canvas>
    <div class="cname" id="bnName"></div>
    <div class="cdesc" id="bnDesc"></div>
    <button class="btn" id="bnPlay">PLAY</button>
    <button class="btn sm m" id="bnSkip">SKIP</button>
  </div>
</div>

<div id="pause" class="screen hide">
  <div class="ptitle">PAUSED</div>
  <div class="col">
    <button class="btn" id="pResume">RESUME</button>
    <button class="btn sm" id="pTut">HOW TO PLAY</button>
    <button class="btn sm" id="pSound">SOUND · ON</button>
    <button class="btn sm m" id="pQuit">QUIT TO MENU</button>
  </div>
</div>

<div id="ver">v0.0.3</div>
<script>
'use strict';
/* ================= NEON WIZARD — core: utils, maths, WebGL plumbing ================= */
const VERSION = '0.0.3';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, t) => { t = clamp((t - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const fmt = n => Math.round(n).toLocaleString('en-GB');
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };

function fatal(e) {
  const d = document.createElement('div'); d.id = 'err';
  d.textContent = 'NEON WIZARD v' + VERSION + ' hit a problem:\n\n' + (e && (e.stack || e.message) || e);
  document.body.appendChild(d);

/* 2 · ORBIT — 400 km above the Earth */
vec3 envOrbit(vec3 ro,vec3 rd){
  vec3 col=vec3(0.,.002,.008)+stars(rd)*1.2;
  float band=exp(-abs(dot(rd,normalize(vec3(.3,1.,-.2))))*6.);
  col+=vec3(.25,.3,.5)*band*fbm(eqUV(rd)*vec2(30.,15.))*.3;
  vec3 sd=normalize(vec3(-.55,.22,.8));

    float cl=smoothstep(.48,.75,fbm3(sp*5.+vec3(uT*.004,0,0)));

    col+=vec3(.3,.6,1.)*pow(1.-max(dot(-rd,n),0.),3.)*(dif*.9+.04)*1.3;

}

/* 3 · THE NEBULA — 1,300 light years out */
vec3 envNebula(vec3 ro,vec3 rd){
  vec3 col=vec3(.004,0.,.012);
  vec3 p=rd*2.2+vec3(0.,0.,uT*.012);

  col+=stars(rd)*(1.-dens*.5);
  float bs=starL(rd,18.,.985);
  col+=vec3(.8,.9,1.)*bs*3.;

}

/* 4 · THE RIFT — reality cracks open */
vec3 voro(vec2 x){
  vec2 n=floor(x),f=fract(x);float md=8.,md2=8.;vec2 id=vec2(0);
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){
    vec2 g=vec2(i,j);vec2 o=vec2(hash(n+g),hash(n+g+17.3));o=.5+.45*sin(uT*.35+TAU*o);

vec3 envRift(vec3 ro,vec3 rd){
  vec2 uv=vec2(atan(rd.x,rd.z)*2.2,rd.y*3.5);

  vec3 A=vec3(.2,1.,.45),B=vec3(.85,1.,.1);

  col+=hsv(.25+v.y*.5,.8,.015+.05*v.z*v.z)*(1.-crack);
  col+=mix(A,B,fbm(uv*2.+uT*.2))*crack*(.8+1.4*uBeat)*(.4+.6*noise(uv*1.5+uT*.3));

}

/* 5 · EVENT HORIZON — 26,000 light years, at the black hole */
vec3 envHorizon(vec3 ro,vec3 rd){
  vec3 bd=normalize(vec3(0.,.16,1.));
  vec3 rt=normalize(cross(vec3(0,1,0),bd));vec3 up=cross(bd,rt);
  float z=dot(rd,bd);
  vec2 q=vec2(dot(rd,rt),dot(rd,up))/max(z,.02);
  float r=max(length(q),1e-3);
  float rs=.085;
  float front=step(0.,z);
  vec3 ld=normalize(rd+(rt*q.x+up*q.y)/r*(rs*rs*1.8/r)*front);
  vec3 col=stars(ld)*1.1+vec3(.012,.005,.02);

  float dop=1.+.8*cos(ang);

  float vis=(e.y<0.||r>rs*1.04)?1.:0.;

  col+=vec3(1.,.75,.4)*(exp(-abs(r-rs*1.07)*140.)*1.6+exp(-abs(r-rs*1.55)*45.)*smoothstep(-.3,.8,q.y/r)*1.3)*front;
  return col;
}

/* 6 · THE WIZARD'S REALM — beyond the light */
vec3 envWizard(vec3 ro,vec3 rd){
  vec3 col=mix(vec3(.02,0.,.05),vec3(.1,0.,.14),smoothstep(-.3,.6,rd.y));
  float a=atan(rd.x,rd.z);
  float cur=fbm(vec2(a*3.,uT*.05))*smoothstep(.04,.45,rd.y)*smoothstep(.95,.45,rd.y);
  col+=mix(vec3(.6,.1,1.),vec3(1.,.3,.8),fbm(vec2(a*6.,rd.y*4.)))*cur*.55;
  vec3 bd=normalize(vec3(0.,.22,1.));
  vec3 rt=normalize(cross(vec3(0,1,0),bd));vec3 up=cross(bd,rt);
  float z=dot(rd,bd);
  if(z>0.){
    vec2 q=vec2(dot(rd,rt),dot(rd,up))/z;float r=length(q);

      float dr=(r-R)/w;col+=vec3(1.,.72,.25)*(exp(-dr*dr)*1.4+exp(-abs(dr)*.35)*.06)*(.35+.65*seg);
    }

  }
  col+=stars(rd)*vec3(1.,.8,1.);
  return col;
}

vec3 env(int d,vec3 ro,vec3 rd){
  if(d<=0)return envAlley(ro,rd);
  if(d==1)return envDark(ro,rd);
  if(d==2)return envOrbit(ro,rd);
  if(d==3)return envNebula(ro,rd);
  if(d==4)return envRift(ro,rd);
  if(d==5)return envHorizon(ro,rd);
  return envWizard(ro,rd);
}
`;

/* ================= PHYSICS: ball, pins, chain reactions ================= */
const LANE = { HW: .5265, GUT: .235, HEAD: 18.29, PIT: 19.35, ROWZ: .264, SP: .3048 };
const BALL_R = .109, PIN_R = .06, PIN_H = .381, HALF_PI = Math.PI / 2;

const ball = {
  x: 0, y: BALL_R, z: -.4, vx: 0, vy: 0, vz: 0, r: BALL_R, m: 7, spin: 0, q: [0, 0, 0, 1],
  active: false, gutter: 0, pit: false, stopped: false, decel: .12, hook: 1.7, hookZ0: 9.5, hookZ1: 14.5, glow: 0,
  launch(x, angle, speed, spin) {
    this.x = x; this.z = -.35; this.y = this.r; this.vx = Math.sin(angle) * speed; this.vz = Math.cos(angle) * speed; this.vy = 0;
    this.spin = spin; this.active = true; this.gutter = 0; this.pit = false; this.stopped = false;
  },
  step(dt) {
    if (!this.active) return;
    const D = WORLD;
    if (!this.gutter && !this.pit) {
      const hz = smooth(this.hookZ0, this.hookZ1, this.z);
      this.vx += this.spin * this.hook * hz * dt;
      this.vx *= 1 - .05 * dt;
    }
    const sp = Math.hypot(this.vx, this.vz);
    if (sp > 0) { const ns = Math.max(0, sp - this.decel * dt); this.vx *= ns / sp; this.vz *= ns / sp; }
    this.x += this.vx * dt; this.z += this.vz * dt;
    if (!this.gutter && !this.pit && Math.abs(this.x) > D.hw + this.r * .25 && this.z > -.2 && this.z < D.end) {
      this.gutter = Math.sign(this.x); this.vx = 0; this.spin = 0;
      if (G.onGutter) G.onGutter();
    }
    if (this.gutter) { this.x = lerp(this.x, this.gutter * (D.hw + LANE.GUT * .5), Math.min(1, dt * 14)); this.y = lerp(this.y, this.r - .075, Math.min(1, dt * 12)); }

    if (D.float && Math.abs(this.x) > D.hw + LANE.GUT + .2) this.pit = true;
    if (this.pit) { this.vy -= 9.8 * dt; this.y += this.vy * dt; if (!D.float) { if (this.y < -.35) { this.y = -.35; this.vy = 0; } if (this.z > D.end + .9) this.vz *= .2; } }
    if (sp < .05 && !this.pit) this.stopped = true;
    const w = [this.vz / this.r, this.spin * 6, -this.vx / this.r], wl = Math.hypot(w[0], w[1], w[2]);
    if (wl > 1e-4) this.q = Q.norm(Q.mul(Q.axis(w[0], w[1], w[2], wl * dt), this.q));
  }
};

/* world bounds that change in super mode / floating dimensions */
const WORLD = { hw: LANE.HW, end: LANE.PIT, float: false, kick: true, void: false };

const PINS = (() => {
  const MAX = 2600, F = () => new Float32Array(MAX);
  return {
    MAX, n: 0, x: F(), z: F(), y: F(), vx: F(), vz: F(), vy: F(), a: F(), w: F(), dx: F(), dz: F(),
    st: new Uint8Array(MAX), hit: F(), dis: F(), seed: F(), drop: F(), x0: F(), z0: F(), stand0: new Uint8Array(MAX),
    gridStart: null, gridCount: null, gridIdx: new Int32Array(MAX), GX0: -14, GZ0: -4, CS: .25, GW: 112, GH: 200,
    clear() { this.n = 0; },
    add(x, z, drop = 0) {
      const i = this.n++; if (i >= MAX) { this.n = MAX; return -1; }
      this.x[i] = this.x0[i] = x; this.z[i] = this.z0[i] = z; this.y[i] = 0; this.vx[i] = this.vz[i] = this.vy[i] = 0;
      this.a[i] = 0; this.w[i] = 0; this.dx[i] = 0; this.dz[i] = 1; this.st[i] = 0; this.hit[i] = 0; this.dis[i] = 0;
      this.seed[i] = Math.random(); this.drop[i] = drop; this.stand0[i] = 1; return i;
    },
    isDown(i) { return this.st[i] >= 2 || this.a[i] > .6 || this.y[i] < -.04; },
    standingCount() { let c = 0; for (let i = 0; i < this.n; i++) if (this.st[i] < 4 && !this.isDown(i)) c++; return c; },
    awakeCount() { let c = 0; for (let i = 0; i < this.n; i++) if (this.st[i] === 1) c++; return c; },
    cx(i) { return this.x[i] + this.dx[i] * Math.sin(this.a[i]) * .17; },
    cz(i) { return this.z[i] + this.dz[i] * Math.sin(this.a[i]) * .17; },
    buildGrid() {
      const N = this.GW * this.GH;
      if (!this.gridStart) { this.gridStart = new Int32Array(N + 1); this.gridCount = new Int32Array(N); this.cellOf = new Int32Array(this.MAX); }
      const cnt = this.gridCount; cnt.fill(0);
      for (let i = 0; i < this.n; i++) {
        if (this.st[i] >= 3) { this.cellOf[i] = -1; continue; }
        const c = this.cell(this.cx(i), this.cz(i)); this.cellOf[i] = c; if (c >= 0) cnt[c]++;
      }
      let s = 0; for (let c = 0; c < N; c++) { this.gridStart[c] = s; s += cnt[c]; } this.gridStart[N] = s;
      const fill = cnt; fill.fill(0);
      for (let i = 0; i < this.n; i++) { const c = this.cellOf[i]; if (c >= 0) this.gridIdx[this.gridStart[c] + fill[c]++] = i; }
    },
    cell(x, z) { const gx = Math.floor((x - this.GX0) / this.CS), gz = Math.floor((z - this.GZ0) / this.CS); if (gx < 0 || gz < 0 || gx >= this.GW || gz >= this.GH) return -1; return gz * this.GW + gx; },
    near(x, z, rad, fn) {
      const g0x = Math.max(0, Math.floor((x - rad - this.GX0) / this.CS)), g1x = Math.min(this.GW - 1, Math.floor((x + rad - this.GX0) / this.CS));
      const g0z = Math.max(0, Math.floor((z - rad - this.GZ0) / this.CS)), g1z = Math.min(this.GH - 1, Math.floor((z + rad - this.GZ0) / this.CS));
      for (let gz = g0z; gz <= g1z; gz++) for (let gx = g0x; gx <= g1x; gx++) {
        const c = gz * this.GW + gx, e = this.gridStart[c + 1];

      }
    },
    tip(i, dirx, dirz, w, wake = true) {
      if (this.st[i] >= 2) return;
      const l = Math.hypot(dirx, dirz) || 1;
      if (this.a[i] < .05) { this.dx[i] = dirx / l; this.dz[i] = dirz / l; }
      this.w[i] = Math.max(this.w[i], w); if (wake) this.st[i] = 1;
    }
  };
})();

const PHYS = {
  acc: 0, DT: 1 / 150, time: 0, hits: 0, onPinDown: null,
  step(frameDt) {
    this.acc += Math.min(frameDt, .05);
    let n = 0;
    while (this.acc >= this.DT && n < 8) { this.sub(this.DT); this.acc -= this.DT; n++; }
  },
  sub(dt) {
    this.time += dt;
    ball.step(dt);
    const P = PINS; P.buildGrid();
    /* ball vs pins */
    if (ball.active && !ball.gutter && ball.y > -.2 && (!ball.pit || ball.y > -.1)) {
      const br = ball.r, bm = ball.m;
      P.near(ball.x, ball.z, br + .15, i => {
        if (P.st[i] >= 3 || P.y[i] > br * 2 + .1) return;
        const sa = Math.sin(P.a[i]), rp = PIN_R + .012 * sa;
        const cx = P.x[i] + P.dx[i] * sa * .17, cz = P.z[i] + P.dz[i] * sa * .17;
        let nx = cx - ball.x, nz = cz - ball.z; const d = Math.hypot(nx, nz), md = br + rp;

/* ---------- layouts ---------- */
function rackStandard() {
  PINS.clear();
  for (let r = 0; r < 4; r++) for (let i = 0; i <= r; i++) PINS.add((i - r / 2) * LANE.SP, LANE.HEAD + r * LANE.ROWZ);
}
function rackTriangle(rows, z0, sp, dropStagger) {
  PINS.clear(); const rz = sp * .866;
  for (let r = 0; r < rows; r++) for (let i = 0; i <= r; i++) PINS.add((i - r / 2) * sp, z0 + r * rz, dropStagger ? 1.2 + r * .035 + Math.random() * .25 : 0);
  return { width: rows * sp, depth: rows * rz };
}
function rackSnake(curve, startX) {
  PINS.clear();
  /* pins along the path a hooked ball would take: x(z) = startX + curve * smooth(6,18,z)^2 */
  for (let z = 5; z <= 18.6; z += .46) {
    const t = smooth(4, 18.8, z);
    PINS.add(startX + curve * t * t * 1.1, z);
  }
}

/* ---------- scoring ---------- */
function frameTotals(frames) {
  const rolls = []; const starts = [];
  for (let f = 0; f < 10; f++) { starts.push(rolls.length); for (const r of (frames[f] || [])) rolls.push(r); }
  const out = []; let total = 0;
  for (let f = 0; f < 10; f++) {
    const fr = frames[f] || [], s = starts[f];
    if (!fr.length) { out.push(null); continue; }
    if (f < 9) {
      if (fr[0] === 10) { if (rolls[s + 1] === undefined || rolls[s + 2] === undefined) { out.push(null); continue; } total += 10 + rolls[s + 1] + rolls[s + 2]; }
      else if (fr.length < 2) { out.push(null); continue; }
      else if (fr[0] + fr[1] === 10) { if (rolls[s + 2] === undefined) { out.push(null); continue; } total += 10 + rolls[s + 2]; }
      else total += fr[0] + fr[1];
    } else {
      const done = fr.length === 3 || (fr.length === 2 && fr[0] + fr[1] < 10);
      if (!done) { out.push(null); continue; }
      total += fr.reduce((a, b) => a + b, 0);
    }
    out.push(total);
  }
  return out;
}
function frameMarks(fr, f) {
  const m = [];
  if (f < 9) {
    if (fr[0] === 10) return ['', 'X'];
    if (fr.length) m.push(fr[0] ? '' + fr[0] : '-');
    if (fr.length > 1) m.push(fr[0] + fr[1] === 10 ? '/' : fr[1] ? '' + fr[1] : '-');
    return m;
  }
  for (let i = 0; i < fr.length; i++) {
    const v = fr[i], fresh = i === 0 ? true : i === 1 ? fr[0] === 10 : (fr[0] === 10 && fr[1] === 10) || (fr[0] !== 10 && fr[0] + fr[1] === 10);
    if (v === 10 && fresh) m.push('X');
    else if (!fresh && i > 0 && fr[i - 1] + v === 10) m.push('/');
    else m.push(v ? '' + v : '-');
  }

}

/* ---------- per-frame game update ---------- */
function gameUpdate(dt, t) {

  } else if (ph === 'spin') { buildGuide(t); }

function lockerName() {
  const n = LOCK.trying ? 'trying · ' + LOCK.trying.name : LOOK.ball.name + ' · ' + LOOK.trail.name + ' · ' + LOOK.lane.name;
  $('eqName').textContent = n;
}
function lockerTabs() {
  const T = $('tabs'); T.innerHTML = '';
  for (const cat of CATS) {
    const b = document.createElement('button'); const lk = SAVE.data.life < cat.gate;
    b.className = 'tab' + (cat.id === LOCK.tab ? ' on' : '') + (lk ? ' lk' : '');
    b.innerHTML = (lk ? '🔒 ' : '') + cat.name;
    b.onclick = () => { AU.click(); LOCK.tab = cat.id; LOCK.armed = null; lockerTabs(); lockerGrid(); };
    T.appendChild(b);
  }
}
function lockerGrid() {
  const cat = CATS.find(c => c.id === LOCK.tab), Gd = $('grid'), d = SAVE.data, lk = d.life < cat.gate;
  Gd.innerHTML = '';
  if (lk) {
    const g = document.createElement('div'); g.className = 'gate';
    g.innerHTML = `<b>${cat.name}</b> OPEN AT ${fmt(cat.gate)} LIFETIME CHIPS<br>${fmt(d.life)} EARNED SO FAR<div class="bar"><i style="width:${Math.min(100, d.life / cat.gate * 100)}%"></i></div>`;
    Gd.appendChild(g);
  }
  for (const it of cat.list()) {
    const own = d.owned.includes(it.id), eq = d.eq[cat.kind] === it.id, can = d.chips >= it.price;
    const el = document.createElement('button');
    el.className = 'it' + (own ? ' own' : '') + (eq ? ' eq' : '') + (lk ? ' lock' : '') + (!own && !can ? ' cant' : '') + (LOCK.armed === it.id ? ' arm' : '');
    let art;
    if (cat.kind === 'ball') art = ballPreview(it); else { art = document.createElement('canvas'); (cat.kind === 'trail' ? drawTrailArt : drawLaneArt)(art, it); }
    const holder = document.createElement('canvas'); holder.width = 144; holder.height = 144; holder.getContext('2d').drawImage(art, 0, 0);
    el.appendChild(holder);
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.name; el.appendChild(nm);
    const pr = document.createElement('div'); pr.className = 'pr';
    pr.innerHTML = eq ? 'EQUIPPED' : own ? 'OWNED' : LOCK.armed === it.id ? `BUY <i class="chip"></i>${fmt(it.price)}?` : (lk ? '🔒 ' : '') + `<i class="chip"></i>${fmt(it.price)}`;
    el.appendChild(pr);
    el.onclick = () => lockerTap(cat, it, el);
    Gd.appendChild(el);
  }
}
function tryOn(cat, it) { LOCK.trying = it; LOOK[cat.kind] = it; RIB.clear(); lockerName(); }
function lockerTap(cat, it, el) {
  const d = SAVE.data, lk = d.life < cat.gate, own = d.owned.includes(it.id);
  if (own) { AU.click(); d.eq[cat.kind] = it.id; SAVE.save(); applyLook(); LOCK.trying = null; LOCK.armed = null; RIB.clear(); lockerGrid(); lockerName(); return; }
  tryOn(cat, it);
  if (lk || d.chips < it.price) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); AU.gutter(); return; }
  if (LOCK.armed === it.id) {
    d.chips -= it.price; d.owned.push(it.id); d.eq[cat.kind] = it.id; SAVE.save(); applyLook(); LOCK.armed = null; LOCK.trying = null;
    for (let k = 0; k < 6; k++) setTimeout(() => AU.chip(k * 3), k * 60);
    FX.burst(ball.x, ball.y, ball.z, 80, LOOK.ball.c1, 2.5, .03, 1);
    UI.chips(); lockerTabs(); lockerGrid(); lockerName(); return;
  }
  AU.click(); LOCK.armed = it.id; lockerGrid();
}

/* ---------- MINI-GAMES list ---------- */
function openMinis() {
  AU.init(); UI.show('minis'); UI.chips();
  const L = $('mlist'); L.innerHTML = ''; const d = SAVE.data;
  for (const m of MINIS) {
    const seen = !!d.minis.seen[m.id], bought = !!d.minis.bought[m.id];
    const card = document.createElement('div'); card.className = 'mg' + (!seen || m.soon ? ' lock' : '');
    const art = document.createElement('canvas'); drawMiniArt(art, m.id); card.appendChild(art);
    const tx = document.createElement('div'); tx.className = 'tx';
    tx.innerHTML = `<h3>${m.name}</h3><p>${m.soon ? m.desc : seen ? m.desc : 'Discover it as a bonus round between games.'}</p>` + (d.minis.best[m.id] ? `<div class="best">BEST ${d.minis.best[m.id]}</div>` : '');
    const btn = document.createElement('button'); btn.className = 'btn sm';
    if (m.soon) { btn.textContent = 'COMING SOON'; btn.disabled = true; }
    else if (!seen) { btn.innerHTML = '🔒 UNDISCOVERED'; btn.disabled = true; }
    else if (bought) { btn.textContent = 'PLAY'; btn.onclick = () => { AU.click(); startMini(m.id, false); }; }
    else { btn.innerHTML = `UNLOCK <i class="chip"></i> ${m.price}`; if (d.chips < m.price) btn.disabled = true;
      btn.onclick = () => { if (d.chips < m.price) return; d.chips -= m.price; d.minis.bought[m.id] = 1; SAVE.save(); AU.chip(5); openMinis(); }; }
    tx.appendChild(btn); card.appendChild(tx); L.appendChild(card);
  }
}

/* ---------- wiring ---------- */
function wireUI() {
  $('bPlay').onclick = () => { AU.click(); startBowling(); };
  $('bLocker').onclick = () => { AU.click(); openLocker(); };
  $('bMinis').onclick = () => { AU.click(); openMinis(); };
  $('lBack').onclick = () => { AU.click(); closeLocker(); };
  $('mgBack').onclick = () => { AU.click(); UI.menu(); };
  $('rAgain').onclick = () => { AU.click(); startBowling(); };
  $('rMenu').onclick = () => { AU.click(); UI.menu(); };
  $('pauseBtn').onclick = () => { AU.click(); G.paused = true; AU.setMuffle(true); UI.show('pause'); };
  $('pResume').onclick = () => { AU.click(); G.paused = false; AU.setMuffle(false); UI.show(null); };
  $('pQuit').onclick = () => { AU.click(); G.paused = false; AU.setMuffle(false); TW.length = 0; AU.roll(0); UI.menu(); };
  const snd = () => { $('pSound').textContent = 'SOUND · ' + (SAVE.data.sound ? 'ON' : 'OFF'); };
  $('pTut').onclick = () => { AU.click(); SAVE.data.tut = false; SAVE.save(); G.paused = false; AU.setMuffle(false); UI.show(null); if (G.phase === 'aim' && !G.inSuper) TUT.start(); };
  $('pSound').onclick = () => { SAVE.data.sound = !SAVE.data.sound; SAVE.save(); AU.setOn(SAVE.data.sound); snd(); };
  snd();
}

/* ================= INPUT + MAIN LOOP ================= */
const IN = { id: null, x0: 0, y0: 0, x: 0, y: 0, moved: false };
const SW = { pts: [], dirty: false };
function inputInit() {
  window.addEventListener('pointerdown', () => AU.init(), { once: true });
  cv.addEventListener('pointerdown', e => {
    AU.init();
    if (G.mode !== 'game' && G.mode !== 'mini') return;
    IN.id = e.pointerId; IN.x0 = IN.x = e.clientX; IN.y0 = IN.y = e.clientY; IN.moved = false;
    if (G.phase === 'spin') SW.pts = [[e.clientX, e.clientY, performance.now()]];
    try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerId !== IN.id) return;
    const dx = e.clientX - IN.x; IN.x = e.clientX; IN.y = e.clientY;
    if (Math.hypot(IN.x - IN.x0, IN.y - IN.y0) > 12) IN.moved = true;
    if (G.phase === 'aim') onDrag(dx, innerWidth);
    if (G.phase === 'spin') SW.pts.push([e.clientX, e.clientY, performance.now()]);
  });
  const up = e => {
    if (e.pointerId !== IN.id) return; IN.id = null;
    if (G.mode !== 'game' && G.mode !== 'mini') return;
    if (G.phase === 'spin' && IN.moved) { onSwipe(IN.x - IN.x0, IN.y - IN.y0, innerWidth); return; }
    if (!IN.moved || G.phase === 'power') onTap();
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', e => { if (e.pointerId === IN.id) IN.id = null; });
  window.addEventListener('keydown', e => {
    if (G.mode !== 'game' && G.mode !== 'mini') return;
    if (e.code === 'Space') { e.preventDefault(); onTap(); }
    if (G.phase === 'aim' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) onDrag((e.code === 'ArrowLeft' ? -1 : 1) * 14, innerWidth);
    if (G.phase === 'spin' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'ArrowUp')) { G.spin = e.code === 'ArrowUp' ? 0 : e.code === 'ArrowLeft' ? -.6 : .6; release(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (!AU.ctx) return;
    if (document.hidden) { AU.ctx.suspend(); if ((G.mode === 'game' || G.mode === 'mini') && !G.paused) $('pauseBtn').onclick(); }
    else AU.ctx.resume();
  });
  cv.addEventListener('webglcontextlost', e => { e.preventDefault(); }, false);
  cv.addEventListener('webglcontextrestored', () => location.reload(), false);
}
function drawSwipe() {
  const f = $('fx'), c = f.getContext('2d'), now = performance.now();
  SW.pts = SW.pts.filter(p => now - p[2] < 380);
  if (!SW.pts.length && !SW.dirty) return;
  const k = f.width / innerWidth; c.clearRect(0, 0, f.width, f.height); SW.dirty = SW.pts.length > 0;
  if (SW.pts.length < 2) return;
  const col = LOOK.lane.B;
  c.lineCap = 'round'; c.lineJoin = 'round'; c.shadowColor = toCss(col); c.shadowBlur = 18 * k;
  for (let i = 1; i < SW.pts.length; i++) {
    const a = SW.pts[i - 1], b = SW.pts[i], al = 1 - (now - b[2]) / 380;
    c.strokeStyle = `rgba(255,255,255,${al})`; c.lineWidth = (4 + 8 * al) * k;
    c.beginPath(); c.moveTo(a[0] * k, a[1] * k); c.lineTo(b[0] * k, b[1] * k); c.stroke();
  }
}

let last = performance.now(), T = 0, slowAcc = 0, perfT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = (now - last) / 1000, dt = Math.min(.05, raw); last = now;
  try {
    if (!G.paused) {
      T += dt;
      updTweens(dt);
      if (G.mode === 'game' || G.mode === 'mini') { gameUpdate(dt, T); PHYS.step(dt); }
      else attractUpdate(dt, T);
      FX.update(dt); SHARDS.update(dt);
    }
    VIS.beat = AU.beat();
    camUpdate(dt);
    resize();
    render(T, G.paused ? 0 : dt);
    drawSwipe();
    /* adaptive resolution: keep it smooth on older phones */
    perfT += raw;
    if (raw > 1 / 42) slowAcc += raw; else slowAcc = Math.max(0, slowAcc - raw * .5);
    if (perfT > 3 && slowAcc > 1.2 && RT.scale > .55) { RT.scale -= .15; W = 0; slowAcc = 0; perfT = 0; }
  } catch (e) { fatal(e); throw e; }
}
function boot() {
  try {
    SAVE.load(); AU.on = SAVE.data.sound; applyLook();
    initRender(); wireUI(); inputInit();
    $('ver').textContent = 'v' + VERSION;
    UI.menu();
    requestAnimationFrame(frame);
  } catch (e) { fatal(e); }
}
boot();
